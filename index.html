<!DOCTYPE html>
<html>
    <head>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
        <style>
            body{
                margin: 0;
            }
            .hidden {
                display: none !important;
            }
            h1 {
                color: white;
                font-size: 65px;
            }
            .winner {
                display: flex;
                justify-content: center;
                align-items: center;
                position: absolute;
                z-index: 1;
                height: 100vh;
                width: 100vw;
            }
            .winner-content {
                text-align: center;
            }
            
            #play-again {
                padding: 12px 24px;
                border: none;
                border-radius: 8px;
                background: white;
                color: black;
                font-size: 18px;
                font-weight: 600;
                cursor: pointer;
            }
            
            #play-again:hover {
                opacity: 0.85;
            }
        </style>
    </head>
    <body>
        <div class="winner hidden">
            <div class="winner-content">
                <h1>You Win!</h1>
                <button id="play-again">Play Again</button>
            </div>
        </div>
    <script src="index.js"></script>
    </body>
</html>
